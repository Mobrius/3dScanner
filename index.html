<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Scanner 3D Avanzato con Foglio A4 – OpenCV.js + three.js</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      overflow: hidden;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      max-width: 340px;
    }
    #ui h1 {
      font-size: 16px;
      margin: 0 0 6px 0;
    }
    #ui p {
      margin: 4px 0;
      line-height: 1.3;
    }
    #ui label {
      display: block;
      margin-top: 6px;
    }
    #ui button {
      margin-top: 8px;
      padding: 5px 10px;
      cursor: pointer;
      background: #0c7;
      border: none;
      border-radius: 4px;
      color: #000;
      font-weight: bold;
    }
    #ui button:disabled {
      background: #555;
      color: #999;
      cursor: default;
    }
    #ui input[type="range"] {
      width: 100%;
    }

    #container {
      display: flex;
      flex-direction: row;
      width: 100vw;
      height: 100vh;
    }

    #leftPanel, #rightPanel {
      flex: 1;
      position: relative;
    }

    #videoContainer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #videoCanvas {
      max-width: 100%;
      max-height: 100%;
      border: 1px solid #333;
    }

    #threeContainer {
      position: absolute;
      inset: 0;
    }

    #status {
      margin-top: 6px;
      font-size: 12px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1>Scanner 3D Avanzato (Foglio A4)</h1>
    <p>
      1. Posiziona un foglio A4 ben visibile sulla scrivania.<br />
      2. Metti l’oggetto al centro del foglio.<br />
      3. Assicurati di avere buona illuminazione.<br />
      4. Quando il contorno del foglio è evidenziato in verde, premi
      <b>Cattura modello 3D</b>.
    </p>

    <label>
      Altezza oggetto (cm):
      <input id="heightSlider" type="range" min="1" max="20" value="5" />
      <span id="heightLabel">5 cm</span>
    </label>

    <button id="captureBtn" disabled>Cattura modello 3D</button>
    <div id="status">Caricamento librerie...</div>
  </div>

  <div id="container">
    <div id="leftPanel">
      <div id="videoContainer">
        <canvas id="videoCanvas"></canvas>
      </div>
    </div>
    <div id="rightPanel">
      <div id="threeContainer"></div>
    </div>
  </div>

  <!-- OpenCV.js (global, async) -->
  <script async src="https://docs.opencv.org/4.x/opencv.js" type="text/javascript"></script>

  <!-- three.js + OrbitControls come script globali
       ⚠️ NOTA: usiamo la versione 0.128.0 perché espone THREE.OrbitControls -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Script principale -->
  <script>
    // ==============================
    // VARIABILI GLOBALI
    // ==============================
    let video = null;
    let videoCanvas = null;
    let videoCtx = null;
    let streaming = false;

    let cvReady = false;
    let paperQuad = null; // 4 punti del foglio A4 nell'immagine

    // Mat temporanei OpenCV – li creeremo quando conosciamo le dimensioni
    let srcMat = null;
    let grayMat = null;
    let blurMat = null;
    let edgeMat = null;
    let hierarchy = null;
    let contours = null;

    const warpWidth = 600;
    const warpHeight = 420;

    // dimensioni reali A4 (m)
    const A4_WIDTH = 0.297;  // lato lungo (297 mm)
    const A4_HEIGHT = 0.210; // lato corto (210 mm)

    // three.js
    let renderer, scene, camera, controls;
    let objectMesh = null;
    let paperMesh = null;

    // UI
    const statusEl = document.getElementById('status');
    const heightSlider = document.getElementById('heightSlider');
    const heightLabel = document.getElementById('heightLabel');
    const captureBtn = document.getElementById('captureBtn');

    heightSlider.addEventListener('input', () => {
      heightLabel.textContent = heightSlider.value + ' cm';
    });

    captureBtn.addEventListener('click', () => {
      if (!cvReady || !streaming || !paperQuad) {
        alert('Foglio A4 non rilevato correttamente.');
        return;
      }
      capture3DModel();
    });

    // ==============================
    // ATTENDI OPENCV
    // ==============================
    function waitForOpenCv() {
      if (window.cv && typeof cv.Mat === 'function') {
        cvReady = true;
        statusEl.textContent = 'OpenCV pronto. Inizializzo elaborazione video...';
      } else {
        setTimeout(waitForOpenCv, 100);
      }
    }

    // ==============================
    // INIT APP
    // ==============================
    window.addEventListener('load', () => {
      initVideo();
      initThree();
      waitForOpenCv();
      requestAnimationFrame(mainLoop);
    });

    // ==============================
    // VIDEO & CANVAS
    // ==============================
    function initVideo() {
  video = document.createElement('video');
  video.setAttribute('autoplay', true);
  video.setAttribute('playsinline', true); // fondamentale su iOS

  videoCanvas = document.getElementById('videoCanvas');
  videoCtx = videoCanvas.getContext('2d');

  // Prima tentiamo la camera posteriore
  const constraints = {
    video: {
      facingMode: { ideal: 'environment' }  // preferisci la posteriore
    },
    audio: false
  };

  navigator.mediaDevices.getUserMedia(constraints)
    .then((stream) => {
      video.srcObject = stream;
      video.addEventListener('loadedmetadata', () => {
        videoCanvas.width = video.videoWidth;
        videoCanvas.height = video.videoHeight;
        streaming = true;
        statusEl.textContent = 'Webcam attiva (posteriore se disponibile). Cerco il foglio A4...';
      });
    })
    .catch((err) => {
      console.warn('Camera posteriore non disponibile, provo fallback:', err);

      // Fallback: qualsiasi camera
      return navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    })
    .then((fallbackStream) => {
      if (!fallbackStream) return; // se anche il fallback fallisce, esco

      if (!streaming) {
        video.srcObject = fallbackStream;
        video.addEventListener('loadedmetadata', () => {
          videoCanvas.width = video.videoWidth;
          videoCanvas.height = video.videoHeight;
          streaming = true;
          statusEl.textContent = 'Webcam attiva (fallback). Cerco il foglio A4...';
        });
      }
    })
    .catch((err2) => {
      console.error('Errore getUserMedia (anche fallback):', err2);
      statusEl.textContent = 'Errore accesso webcam: ' + err2;
    });
}


    // ==============================
    // THREE.JS
    // ==============================
    function initThree() {
      const container = document.getElementById('threeContainer');
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);

      camera = new THREE.PerspectiveCamera(
        50,
        container.clientWidth / container.clientHeight,
        0.01,
        10
      );
      camera.position.set(0.25, 0.25, 0.5);

      // QUI adesso THREE.OrbitControls esiste davvero
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0, 0);
      controls.update();

      const ambient = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambient);

      const dir = new THREE.DirectionalLight(0xffffff, 0.8);
      dir.position.set(0.5, 1, 0.7);
      scene.add(dir);

      // Piano del foglio A4 (XZ, y=0)
      const paperGeom = new THREE.PlaneGeometry(A4_WIDTH, A4_HEIGHT);
      const paperMat = new THREE.MeshStandardMaterial({
        color: 0x333333,
        side: THREE.DoubleSide
      });
      paperMesh = new THREE.Mesh(paperGeom, paperMat);
      paperMesh.rotation.x = -Math.PI / 2; // da XY a XZ
      scene.add(paperMesh);

      const grid = new THREE.GridHelper(0.5, 10, 0x555555, 0x222222);
      grid.position.y = 0;
      scene.add(grid);

      window.addEventListener('resize', onWindowResize);
      animateThree();
    }

    function onWindowResize() {
      const container = document.getElementById('threeContainer');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function animateThree() {
      requestAnimationFrame(animateThree);
      controls.update();
      renderer.render(scene, camera);
    }

    // ==============================
    // LOOP PRINCIPALE
    // ==============================
    function mainLoop() {
      requestAnimationFrame(mainLoop);

      if (!streaming || !cvReady) return;

      videoCtx.drawImage(video, 0, 0, videoCanvas.width, videoCanvas.height);

      if (!srcMat) {
        srcMat = new cv.Mat(videoCanvas.height, videoCanvas.width, cv.CV_8UC4);
        grayMat = new cv.Mat(videoCanvas.height, videoCanvas.width, cv.CV_8UC1);
        blurMat = new cv.Mat(videoCanvas.height, videoCanvas.width, cv.CV_8UC1);
        edgeMat = new cv.Mat(videoCanvas.height, videoCanvas.width, cv.CV_8UC1);
        hierarchy = new cv.Mat();
        contours = new cv.MatVector();
      }

      const imageData = videoCtx.getImageData(0, 0, videoCanvas.width, videoCanvas.height);
      srcMat.data.set(imageData.data);

      detectPaper(srcMat, grayMat, blurMat, edgeMat, contours, hierarchy);

      const outImageData = new ImageData(
        new Uint8ClampedArray(srcMat.data),
        videoCanvas.width,
        videoCanvas.height
      );
      videoCtx.putImageData(outImageData, 0, 0);

      if (paperQuad) {
        captureBtn.disabled = false;
        statusEl.textContent = 'Foglio A4 trovato. Puoi catturare il modello 3D.';
      } else {
        captureBtn.disabled = true;
        statusEl.textContent = 'Cerco il contorno del foglio A4...';
      }
    }

    // ==============================
    // RILEVAZIONE FOGLIO A4
    // ==============================
    function detectPaper(src, gray, blur, edges, contours, hierarchy) {
      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
      cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);
      cv.Canny(blur, edges, 75, 200);

      cv.findContours(edges, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

      let maxArea = 0;
      let bestQuad = null;

      for (let i = 0; i < contours.size(); i++) {
        const cnt = contours.get(i);
        const peri = cv.arcLength(cnt, true);
        const approx = new cv.Mat();
        cv.approxPolyDP(cnt, approx, 0.02 * peri, true);

        if (approx.rows === 4) {
          const area = cv.contourArea(approx);
          if (area > maxArea && area > (src.rows * src.cols * 0.05)) {
            maxArea = area;
            bestQuad = [];
            for (let j = 0; j < 4; j++) {
              const x = approx.intPtr(j, 0)[0];
              const y = approx.intPtr(j, 0)[1];
              bestQuad.push({ x, y });
            }
          }
        }
        approx.delete();
        cnt.delete();
      }

      if (bestQuad) {
        paperQuad = orderQuad(bestQuad);

        const color = new cv.Scalar(0, 255, 0, 255);
        for (let i = 0; i < 4; i++) {
          const p1 = paperQuad[i];
          const p2 = paperQuad[(i + 1) % 4];
          cv.line(src, new cv.Point(p1.x, p1.y), new cv.Point(p2.x, p2.y), color, 2);
        }
      } else {
        paperQuad = null;
      }
    }

    function orderQuad(pts) {
      let tl, tr, br, bl;
      let minSum = Infinity, maxSum = -Infinity;
      let minDiff = Infinity, maxDiff = -Infinity;

      for (const p of pts) {
        const sum = p.x + p.y;
        const diff = p.x - p.y;

        if (sum < minSum) {
          minSum = sum;
          tl = p;
        }
        if (sum > maxSum) {
          maxSum = sum;
          br = p;
        }
        if (diff < minDiff) {
          minDiff = diff;
          tr = p;
        }
        if (diff > maxDiff) {
          maxDiff = diff;
          bl = p;
        }
      }
      return [tl, tr, br, bl];
    }

    // ==============================
    // CATTURA & COSTRUZIONE MODELLO 3D
    // ==============================
    function capture3DModel() {
      if (!paperQuad) return;

      const src = srcMat;
      const warped = new cv.Mat();

      const srcPts = cv.matFromArray(4, 1, cv.CV_32FC2, [
        paperQuad[0].x, paperQuad[0].y,
        paperQuad[1].x, paperQuad[1].y,
        paperQuad[2].x, paperQuad[2].y,
        paperQuad[3].x, paperQuad[3].y
      ]);
      const dstPts = cv.matFromArray(4, 1, cv.CV_32FC2, [
        0, 0,
        warpWidth, 0,
        warpWidth, warpHeight,
        0, warpHeight
      ]);

      const M = cv.getPerspectiveTransform(srcPts, dstPts);
      cv.warpPerspective(src, warped, M, new cv.Size(warpWidth, warpHeight));

      srcPts.delete();
      dstPts.delete();
      M.delete();

      const warpedGray = new cv.Mat();
      cv.cvtColor(warped, warpedGray, cv.COLOR_RGBA2GRAY);

      const warpedBlur = new cv.Mat();
      cv.GaussianBlur(warpedGray, warpedBlur, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);

      const binary = new cv.Mat();
      cv.threshold(warpedBlur, binary, 0, 255, cv.THRESH_BINARY_INV + cv.THRESH_OTSU);

      const kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(3, 3));
      cv.morphologyEx(binary, binary, cv.MORPH_OPEN, kernel);
      kernel.delete();

      const contVec = new cv.MatVector();
      const hier = new cv.Mat();
      cv.findContours(binary, contVec, hier, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

      let bestContour = null;
      let bestArea = 0;

      for (let i = 0; i < contVec.size(); i++) {
        const cnt = contVec.get(i);
        const area = cv.contourArea(cnt);
        if (area < 100) {
          cnt.delete();
          continue;
        }
        const rect = cv.boundingRect(cnt);
        const margin = 10;
        if (
          rect.x <= margin ||
          rect.y <= margin ||
          rect.x + rect.width >= warpWidth - margin ||
          rect.y + rect.height >= warpHeight - margin
        ) {
          cnt.delete();
          continue;
        }

        if (area > bestArea) {
          if (bestContour) bestContour.delete();
          bestContour = cnt;
          bestArea = area;
        } else {
          cnt.delete();
        }
      }

      if (!bestContour) {
        statusEl.textContent = 'Oggetto non trovato sopra il foglio (prova con maggior contrasto).';
        warped.delete();
        warpedGray.delete();
        warpedBlur.delete();
        binary.delete();
        contVec.delete();
        hier.delete();
        return;
      }

      const approx = new cv.Mat();
      const peri = cv.arcLength(bestContour, true);
      cv.approxPolyDP(bestContour, approx, 0.01 * peri, true);
      const simplified = [];
      for (let i = 0; i < approx.rows; i++) {
        const x = approx.intPtr(i, 0)[0];
        const y = approx.intPtr(i, 0)[1];
        simplified.push({ x, y });
      }

      bestContour.delete();
      approx.delete();
      contVec.delete();
      hier.delete();
      warped.delete();
      warpedGray.delete();
      warpedBlur.delete();
      binary.delete();

      if (simplified.length < 3) {
        statusEl.textContent = 'Contorno oggetto troppo semplice o non valido.';
        return;
      }

      const pts3D = simplified.map((p) => {
        const u = p.x;
        const v = p.y;
        const x = (u / warpWidth - 0.5) * A4_WIDTH;
        const z = (v / warpHeight - 0.5) * A4_HEIGHT;
        return { x, z };
      });

      const heightMeters = parseFloat(heightSlider.value) / 100.0;

      if (objectMesh) {
        scene.remove(objectMesh);
        objectMesh.geometry.dispose();
        objectMesh.material.dispose();
        objectMesh = null;
      }

      const shape = new THREE.Shape();
      pts3D.forEach((p, idx) => {
        if (idx === 0) shape.moveTo(p.x, p.z);
        else shape.lineTo(p.x, p.z);
      });
      shape.closePath();

      const extrudeSettings = {
        depth: heightMeters,
        bevelEnabled: false
      };

      const geom = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geom.rotateX(-Math.PI / 2);

      const mat = new THREE.MeshStandardMaterial({
        color: 0x66ccff,
        metalness: 0.1,
        roughness: 0.8
      });

      objectMesh = new THREE.Mesh(geom, mat);
      objectMesh.position.y = 0;
      scene.add(objectMesh);

      statusEl.textContent = 'Modello 3D catturato (scala approssimata ma realistica).';
    }

    // ==============================
    // CLEANUP
    // ==============================
    window.addEventListener('beforeunload', () => {
      if (window.cv) {
        if (srcMat) srcMat.delete();
        if (grayMat) grayMat.delete();
        if (blurMat) blurMat.delete();
        if (edgeMat) edgeMat.delete();
        if (hierarchy) hierarchy.delete();
        if (contours) contours.delete();
      }
    });
  </script>
</body>
</html>
